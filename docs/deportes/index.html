<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Deportes</title>
<meta name="description" content="Calendario, posiciones, planteles y noticias de mis equipos">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#05010f">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deportes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="styles.css?v=3">
<link rel="stylesheet" href="detalle.css?v=3">
<link rel="stylesheet" href="escudos.css?v=3">
<link rel="stylesheet" href="extras.css?v=3">
<link rel="stylesheet" href="movimiento.css?v=3">
<link rel="stylesheet" href="iphone.css?v=3">
<link rel="stylesheet" href="semana.css?v=3">
<link rel="stylesheet" href="tema.css?v=3">
<link rel="stylesheet" href="clubes.css?v=3">
</head>
<body>

<!-- Fondo: campo de estrellas + rejilla CRT -->
<canvas id="estrellas" aria-hidden="true"></canvas>
<div id="scanlines" aria-hidden="true"></div>

<!-- Pantalla de carga -->
<div id="cargando" role="status" aria-live="polite">
  <div class="carga-marco">
    <div class="carga-logo">MIS<br>DEPORTES</div>
    <div class="carga-barra"><i></i></div>
    <p class="carga-txt">CARGANDO<span class="puntos"></span></p>
  </div>
</div>

<!-- Cinta de titulares -->
<div id="ticker" aria-hidden="true"><div id="ticker-pista"></div></div>

<header id="top">
  <button id="btn-inicio" class="marca" aria-label="Volver al inicio">
    <span class="marca-txt">MIS DEPORTES</span>
    <span class="marca-sub">EST. 2026 · <span class="parpadea">★</span> EN VIVO</span>
  </button>
  <button id="btn-noti" class="btn3d" aria-label="Activar notificaciones">
    <span aria-hidden="true">🔔</span><span id="noti-txt">AVISOS</span>
  </button>
</header>

<!-- Anillo de navegación por deporte -->
<nav id="anillo" aria-label="Secciones"></nav>

<main id="vista"></main>

<footer id="pie">
  <div class="contador" id="contador-visitas" aria-hidden="true"></div>
  <p id="pie-txt">—</p>
  <p class="pie-mini">Datos de ESPN y Jolpica · hecho para mirar partidos</p>
</footer>

<div id="destello" aria-hidden="true"></div>
<div id="aviso" role="status" hidden></div>

<script src="fx.js?v=3" defer></script>
<script type="module" src="app.js?v=3"></script>

<style id="volver-al-panel">
  .volver-panel{
    position:fixed; z-index:9999;
    left:max(.7rem, env(safe-area-inset-left));
    bottom:max(.7rem, env(safe-area-inset-bottom));
    display:inline-flex; align-items:center; gap:.45em;
    padding:.5em .85em .5em .7em;
    border:1px solid rgba(255,255,255,.16);
    border-radius:100px;
    background:rgba(0,0,0,.55);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    color:var(--tema);
    font:600 .78rem/1 system-ui,-apple-system,'Segoe UI',sans-serif;
    text-decoration:none;
    box-shadow:0 2px 14px rgba(0,0,0,.28);
    transition:transform .3s cubic-bezier(.51,.01,.2,1), opacity .2s ease;
    opacity:.82;
  }
  .volver-panel:hover,.volver-panel:focus-visible{ opacity:1; transform:translateY(-2px) }
  .volver-panel:active{ transform:scale(.96); transition-duration:.11s }
  .volver-panel span{ font-size:1.05em; line-height:0 }
  @media print{ .volver-panel{ display:none } }
  @media (prefers-reduced-motion:reduce){ .volver-panel{ transition:none } }
</style>
<a class="volver-panel" href="../" aria-label="Volver al Panel"><span aria-hidden="true">←</span>Panel</a>
</body>
</html>
