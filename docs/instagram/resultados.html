<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Panel de Instagram</title>
<!--
  POR QUÉ EXISTE ESTA PÁGINA

  En iPhone no hay forma de LEER Instagram: Apple no deja instalar apps fuera de
  su tienda, y una página web no puede entrar a la sesión de Instagram — probado,
  responde `X-Frame-Options: DENY` y no manda ninguna cabecera CORS.

  Mostrar lo ya leído sí se puede. La computadora escanea y sube el resultado al
  panel privado; esta página lo baja y lo muestra.

  LA PIEL ES LA DEL PANEL DE VERDAD
  Los valores salen de scripts/piel-panel-ig.mjs, que es la capa que le da al
  panel su aspecto actual: negro, verde ácido #CCFF00, magenta #FF2D7A, bordes
  blancos de 2 px y CERO redondeos. Una versión anterior de esta página usó el
  degradado azul-rosa-naranja del CSS base, que la piel justamente reemplazó, y
  parecía otra aplicación.

  QUÉ SE PUEDE Y QUÉ NO DESDE EL TELÉFONO
  Todo lo que sea LEER el último escaneo funciona. Lo que necesita hablar con
  Instagram en vivo —reescanear, dejar de seguir, leer mensajes— no, y se dice
  en pantalla en vez de esconderlo.
-->
<style>
  :root{
    --negro:#000; --casi:#0d0d0d; --linea:#333; --linea2:#2a2a2a;
    --tinta:#fff; --tenue:#8b8b8b; --tenue2:#c9c9c9;
    --acido:#CCFF00; --magenta:#FF2D7A;
    --f:system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;border-radius:0}
  body{
    background:var(--negro); color:var(--tinta); font-family:var(--f);
    font-size:16px; line-height:1.5; min-height:100dvh;
    padding:max(8px,env(safe-area-inset-top)) 8px calc(env(safe-area-inset-bottom) + 10px);
  }
  .panel{
    background:var(--negro); border:2px solid var(--tinta);
    max-width:920px; margin:0 auto;
    display:flex; flex-direction:column; min-height:calc(100dvh - 24px);
  }

  /* ── cabecera ── */
  .cabeza{
    display:flex; align-items:center; gap:11px;
    padding:13px 16px; border-bottom:3px solid var(--tinta);
  }
  .cuadro{width:20px;height:20px;background:var(--acido);flex:0 0 auto}
  .titulo{font-weight:900;text-transform:uppercase;letter-spacing:-.02em;font-size:1.02rem}
  .titulo em{color:var(--magenta);font-style:normal}
  .ver{color:var(--tenue);font-size:.66rem;font-weight:700;margin-left:auto;font-family:var(--mono)}

  /* ── pestañas ── */
  .pestanas{display:flex;border-bottom:2px solid var(--linea);overflow-x:auto;scrollbar-width:none}
  .pestanas::-webkit-scrollbar{display:none}
  .pestanas button{
    background:var(--negro);border:0;border-bottom:3px solid transparent;
    color:var(--tenue);padding:12px 13px;cursor:pointer;
    font:800 .76rem var(--f);text-transform:uppercase;letter-spacing:.04em;
    white-space:nowrap;
  }
  .pestanas button.on{color:var(--acido);border-bottom-color:var(--acido)}

  .cuerpo{padding:14px;overflow:auto;flex:1}

  /* ── cajas ── */
  .caja{border:2px solid var(--tinta);padding:12px 13px;margin-bottom:11px}
  .caja.tenue{border-color:var(--linea)}
  .caja.acido{border-color:var(--acido)}
  .sesion{font-size:.86rem;color:var(--tenue2);margin-bottom:11px}
  .sesion b{color:var(--acido)}
  .resumen{font-size:.95rem;font-weight:700}
  .resumen .rosa{color:var(--magenta)}
  .resumen .chico{display:block;color:var(--tenue);font-size:.76rem;font-weight:400;margin-top:3px}

  /* ── controles ── */
  input[type=search],input[type=text],input[type=password]{
    width:100%;padding:11px 12px;border:2px solid var(--linea);
    background:var(--negro);color:var(--tinta);font:1rem var(--f);outline:none;
  }
  input:focus{border-color:var(--acido)}
  .btn{
    background:var(--negro);border:2px solid var(--tinta);color:var(--tinta);
    padding:11px 14px;cursor:pointer;font:800 .82rem var(--f);
    text-transform:uppercase;letter-spacing:.04em;
  }
  .btn:hover{background:var(--casi)}
  .btn.pri{background:var(--acido);border-color:var(--acido);color:var(--negro)}
  .btn.ancho{width:100%;margin-top:10px}
  .fila-ctrl{display:flex;gap:8px;margin-bottom:9px}
  .fila-ctrl input{flex:1;min-width:0}

  .modos{display:flex;gap:0;margin-bottom:10px}
  .modos button{
    flex:1;background:var(--negro);border:2px solid var(--linea);color:var(--tenue);
    padding:10px 8px;cursor:pointer;font:800 .8rem var(--f);
  }
  .modos button+button{border-left:0}
  .modos button.on{background:var(--acido);border-color:var(--acido);color:var(--negro)}

  .filtros{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
  .filtros button{
    background:var(--negro);border:2px solid var(--linea);color:var(--tenue);
    padding:8px 11px;cursor:pointer;font:700 .78rem var(--f);
    display:flex;align-items:center;gap:6px;
  }
  .filtros button .tic{
    width:14px;height:14px;border:2px solid var(--linea);display:inline-block;flex:0 0 auto;
  }
  .filtros button.on{color:var(--tinta);border-color:var(--magenta)}
  .filtros button.on .tic{background:var(--magenta);border-color:var(--magenta)}

  .contador{color:var(--tenue);font-size:.78rem;font-family:var(--mono);margin-bottom:9px}

  /* ── filas ── */
  .lista{display:flex;flex-direction:column;gap:7px}
  .fila{
    display:flex;align-items:center;gap:11px;padding:9px 11px;
    border:1px solid var(--linea2);background:var(--negro);
    text-decoration:none;color:inherit;
  }
  .fila:hover{background:var(--casi);border-color:var(--acido)}
  .av{
    width:42px;height:42px;flex:0 0 auto;border:2px solid var(--magenta);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;color:var(--tenue);font-size:.95rem;
  }
  .av.blanca{border-color:var(--acido)}
  .datos{min-width:0;flex:1}
  .usuario{font-weight:800;font-size:.98rem;color:var(--tinta);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{display:block;color:var(--tenue);font-size:.78rem;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta .no{color:var(--magenta);font-weight:700}
  .meta .si{color:var(--acido);font-weight:700}
  .estrella{
    background:var(--negro);border:2px solid var(--linea);color:var(--tenue);
    width:34px;height:34px;flex:0 0 auto;cursor:pointer;font-size:.9rem;line-height:1;
  }
  .estrella.on{background:var(--acido);border-color:var(--acido);color:var(--negro)}

  .aviso{border:2px solid var(--linea);padding:13px;font-size:.88rem;color:var(--tenue2);line-height:1.55}
  .aviso.acido{border-color:var(--acido)}
  .aviso.rosa{border-color:var(--magenta)}
  .aviso b{color:var(--tinta)}
  .etq{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);font-weight:800;margin-bottom:6px}
  .vacio{text-align:center;color:var(--tenue);padding:26px 10px;font-size:.9rem}
  .oculto{display:none !important}

  /* ── estadísticas ── */
  .numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}
  .numeros.dos{grid-template-columns:repeat(2,1fr)}
  .stat{border:2px solid var(--linea);padding:14px 6px;text-align:center}
  .stat .n{font-size:1.5rem;font-weight:900;font-family:var(--mono);line-height:1.05}
  .stat.acido .n{color:var(--acido)} .stat.rosa .n{color:var(--magenta)}
  .stat .l{color:var(--tenue);font-size:.68rem;margin-top:4px;text-transform:uppercase;letter-spacing:.04em}

  /* ── gráfico ── */
  .grafico{border:2px solid var(--linea);padding:12px 10px 8px;margin-bottom:11px}
  .grafico svg{width:100%;height:140px;display:block}
  .leyenda{display:flex;gap:15px;justify-content:center;margin-top:9px;font-size:.74rem;color:var(--tenue)}
  .leyenda i{display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle}

  .pie{padding:10px 14px;border-top:2px solid var(--linea);color:var(--tenue);font-size:.72rem}
  .pie a{color:var(--tenue)}

  @media(max-width:420px){
    body{padding-left:5px;padding-right:5px}
    .cuerpo{padding:11px}
    .pestanas button{padding:11px 9px;font-size:.68rem}
    .titulo{font-size:.92rem}
    .stat .n{font-size:1.3rem}
    .av{width:38px;height:38px;font-size:.85rem}
  }
</style>
</head>
<body>

<div class="panel">
  <div class="cabeza">
    <span class="cuadro"></span>
    <span class="titulo">Panel de <em>Instagram</em></span>
    <span class="ver" id="ver">v1.3</span>
  </div>

  <div class="pestanas" id="pestanas"></div>

  <div class="cuerpo">
    <div id="pedirClave">
      <span class="etq">Clave de tu panel</span>
      <input type="password" id="clave" placeholder="la misma que usás en Plata" autocomplete="off">
      <button class="btn pri ancho" id="entrar">Entrar</button>
      <p class="aviso" style="margin-top:12px">Queda guardada en este teléfono. Es la clave de tu <b>Panel</b>, no la contraseña de Instagram.</p>
    </div>

    <div id="aviso" class="aviso oculto"></div>
    <div id="vista" class="oculto"></div>
  </div>

  <div class="pie">🔒 Todo se procesa en este teléfono. <a href="./">Volver a la instalación</a></div>
</div>

<script>
(function(){
  var WORKER = 'https://plata.hamcqc.workers.dev';
  var LS = 'panel-ig-clave', LS_WL = 'panel-ig-wl';
  var datos = null, pestana = 'seguidores', mostrando = 30, busqueda = '', modo = 'normal';
  var filtros = { noSiguen:true, teSiguen:false, verificados:true, privados:true };
  var blanca = new Set();

  var $ = function(s){ return document.querySelector(s); };
  function clave(){ try{ return localStorage.getItem(LS) || ''; }catch(e){ return ''; } }
  function guardar(v){ try{ v ? localStorage.setItem(LS, v) : localStorage.removeItem(LS); }catch(e){} }
  function esc(t){
    return String(t == null ? '' : t)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  var num = function(n){ return Number(n).toLocaleString('es-AR'); };
  function cuando(iso){
    if(!iso) return '';
    var s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
    if(s < 3600) return 'hace ' + Math.max(1,Math.floor(s/60)) + ' min';
    if(s < 86400) return 'hace ' + Math.floor(s/3600) + ' h';
    var d = Math.floor(s/86400);
    return 'hace ' + d + ' día' + (d > 1 ? 's' : '');
  }
  var users = function(){ return (datos && datos.users) || []; };

  // La lista blanca llega del escaneo, pero se puede editar acá: lo tocado en el
  // teléfono se guarda local y pisa a lo que vino, así una estrella no se pierde
  // hasta el próximo escaneo.
  function cargarBlanca(){
    blanca = new Set(((datos && datos.listaBlanca) || []).map(function(u){ return String(u).toLowerCase(); }));
    try{
      var local = JSON.parse(localStorage.getItem(LS_WL) || 'null');
      if(local && local.suma) local.suma.forEach(function(u){ blanca.add(u); });
      if(local && local.resta) local.resta.forEach(function(u){ blanca.delete(u); });
    }catch(e){}
  }
  function tocarBlanca(usuario){
    var u = String(usuario).toLowerCase();
    var base = new Set(((datos && datos.listaBlanca) || []).map(function(x){ return String(x).toLowerCase(); }));
    var local;
    try{ local = JSON.parse(localStorage.getItem(LS_WL) || 'null'); }catch(e){}
    local = local || { suma:[], resta:[] };
    var suma = new Set(local.suma || []), resta = new Set(local.resta || []);
    if(blanca.has(u)){ blanca.delete(u); suma.delete(u); if(base.has(u)) resta.add(u); }
    else { blanca.add(u); resta.delete(u); if(!base.has(u)) suma.add(u); }
    try{ localStorage.setItem(LS_WL, JSON.stringify({ suma:[...suma], resta:[...resta] })); }catch(e){}
  }

  var PESTANAS = [
    { id:'seguidores',  texto:'Seguidores' },
    { id:'dejaron',     texto:'Te dejaron' },
    { id:'mensajes',    texto:'Sin respuesta' },
    { id:'historias',   texto:'Historias' },
    { id:'estadisticas',texto:'Estadísticas' },
    { id:'estrategia',  texto:'Estrategia' }
  ];
  function pintarPestanas(){
    $('#pestanas').innerHTML = PESTANAS.map(function(p){
      return '<button data-p="' + p.id + '"' + (p.id === pestana ? ' class="on"' : '') + '>' +
             esc(p.texto) + '</button>';
    }).join('');
  }

  /* ── piezas ── */
  function banda(){
    return '<div class="sesion">✅ <b>@' + esc(datos.usuario || '?') + '</b> · ' +
      num(datos.seguidores || 0) + ' seguidores · ' + num(datos.seguidos || 0) + ' seguidos</div>';
  }
  function resumenEscaneo(){
    var no = datos.noSiguen != null ? datos.noSiguen
      : users().filter(function(u){ return !u.follows_viewer; }).length;
    return '<div class="caja acido"><div class="resumen">' +
      num(users().length) + ' seguidos analizados · <span class="rosa">' + num(no) + '</span> no te siguen de vuelta' +
      '<span class="chico">Último escaneo: ' + cuando(datos.escaneadoEn || datos.actualizado) +
      ' · se escanea desde la computadora</span></div></div>';
  }
  function filaUsuario(u, metaHtml, conEstrella){
    var enBlanca = blanca.has(String(u.username).toLowerCase());
    return '<div class="fila">' +
      '<a class="av' + (u.follows_viewer ? ' blanca' : '') + '" href="https://www.instagram.com/' +
        encodeURIComponent(u.username) + '/" target="_blank" rel="noopener">' +
        esc((u.username || '?').slice(0,1).toUpperCase()) + '</a>' +
      '<a class="datos" href="https://www.instagram.com/' + encodeURIComponent(u.username) +
        '/" target="_blank" rel="noopener" style="text-decoration:none">' +
        '<div class="usuario">@' + esc(u.username) + '</div>' +
        '<span class="meta">' + metaHtml + '</span>' +
      '</a>' +
      (conEstrella ? '<button class="estrella' + (enBlanca ? ' on' : '') + '" data-wl="' +
        esc(u.username) + '" title="Lista blanca">★</button>' : '') +
    '</div>';
  }
  function listaConMas(lista, pintarUno){
    var visibles = lista.slice(0, mostrando);
    var faltan = lista.length - mostrando;
    return '<div class="contador">Mostrados: ' + num(visibles.length) + ' · Total filtrado: ' + num(lista.length) + '</div>' +
      '<div class="lista">' +
        (visibles.length ? visibles.map(pintarUno).join('') : '<div class="vacio">Nada que mostrar con estos filtros.</div>') +
      '</div>' +
      (faltan > 0 ? '<button class="btn ancho" id="mas">Ver ' + Math.min(100, faltan) + ' más</button>' : '');
  }
  function tarjeta(valor, etiqueta, clase){
    var v = (valor === null || valor === undefined) ? '—' : (typeof valor === 'number' ? num(valor) : valor);
    return '<div class="stat ' + (clase||'') + '"><div class="n">' + esc(v) + '</div>' +
           '<div class="l">' + esc(etiqueta) + '</div></div>';
  }

  /* ── SEGUIDORES ── */
  function vistaSeguidores(){
    var lista = users().filter(function(u){
      var enB = blanca.has(String(u.username).toLowerCase());
      if(modo === 'blanca' && !enB) return false;
      if(modo === 'normal' && enB) return false;
      if(!filtros.noSiguen && !u.follows_viewer) return false;
      if(!filtros.teSiguen && u.follows_viewer) return false;
      if(!filtros.verificados && u.is_verified) return false;
      if(!filtros.privados && u.is_private) return false;
      if(busqueda && (u.username||'').toLowerCase().indexOf(busqueda) < 0 &&
                     (u.full_name||'').toLowerCase().indexOf(busqueda) < 0) return false;
      return true;
    });

    return banda() + resumenEscaneo() +
      '<div class="fila-ctrl">' +
        '<input type="search" id="buscar" placeholder="Buscar usuario…" value="' + esc(busqueda) + '">' +
        '<button class="btn" id="copiar">Copiar lista</button>' +
      '</div>' +
      '<div class="modos">' +
        '<button data-m="normal"' + (modo==='normal'?' class="on"':'') + '>Normal</button>' +
        '<button data-m="blanca"' + (modo==='blanca'?' class="on"':'') + '>★ Lista blanca (' + blanca.size + ')</button>' +
      '</div>' +
      '<div class="filtros">' +
        tic('noSiguen','No te siguen') + tic('teSiguen','Te siguen') +
        tic('verificados','Verificados') + tic('privados','Privados') +
      '</div>' +
      listaConMas(lista, function(u){
        var m = (u.full_name ? esc(u.full_name) + ' · ' : '') +
          (u.follows_viewer ? '<span class="si">te sigue</span>' : '<span class="no">no te sigue</span>') +
          (u.is_verified ? ' · ✓ verificada' : '') + (u.is_private ? ' · privada' : '');
        return filaUsuario(u, m, true);
      });
  }
  function tic(id, texto){
    return '<button data-f="' + id + '"' + (filtros[id] ? ' class="on"' : '') + '>' +
      '<span class="tic"></span>' + esc(texto) + '</button>';
  }

  /* ── TE DEJARON ── */
  function vistaDejaron(){
    var todos = (datos.perdidos || []).slice().sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
    if(!todos.length){
      return banda() + '<div class="aviso">Todavía no hay registro de nadie que te haya dejado de seguir. ' +
        'Se llena solo cuando escaneás varias veces desde la computadora: compara cada lista con la anterior.</div>';
    }
    var lista = busqueda ? todos.filter(function(x){ return (x.u||'').toLowerCase().indexOf(busqueda) >= 0; }) : todos;
    var semana = todos.filter(function(x){ return Date.now() - (x.ts||0) < 7*86400e3; }).length;
    return banda() +
      '<div class="numeros dos">' + tarjeta(todos.length,'Te dejaron','rosa') +
        tarjeta(semana,'Esta semana', semana ? 'rosa' : '') + '</div>' +
      '<div class="fila-ctrl"><input type="search" id="buscar" placeholder="Buscar usuario…" value="' + esc(busqueda) + '"></div>' +
      listaConMas(lista, function(x){
        return filaUsuario({username:x.u}, x.ts ? cuando(new Date(x.ts).toISOString()) : '', false);
      });
  }

  /* ── HISTORIAS ── */
  function vistaHistorias(){
    var todos = (datos.historias || []);
    if(!todos.length){
      return banda() + '<div class="aviso">Todavía no hay espectadores guardados. ' +
        'Se llenan al abrir la pestaña Historias en la computadora, con una historia activa.</div>';
    }
    var sigo = {}; users().forEach(function(u){ sigo[(u.username||'').toLowerCase()] = true; });
    var deAfuera = todos.filter(function(x){ return !sigo[(x.username||'').toLowerCase()]; }).length;
    var lista = busqueda ? todos.filter(function(x){
      return (x.username||'').toLowerCase().indexOf(busqueda) >= 0 ||
             (x.full_name||'').toLowerCase().indexOf(busqueda) >= 0; }) : todos;
    return banda() +
      '<div class="numeros dos">' + tarjeta(todos.length,'Te vieron','acido') +
        tarjeta(deAfuera,'Que vos no seguís') + '</div>' +
      '<div class="fila-ctrl"><input type="search" id="buscar" placeholder="Buscar usuario…" value="' + esc(busqueda) + '"></div>' +
      listaConMas(lista, function(x){
        var m = (x.full_name ? esc(x.full_name) + ' · ' : '') + (x.veces||1) +
          ((x.veces||1) > 1 ? ' historias' : ' historia') +
          (sigo[(x.username||'').toLowerCase()] ? '' : ' · <span class="si">no la seguís</span>');
        return filaUsuario({username:x.username}, m, false);
      });
  }

  /* ── ESTADÍSTICAS ── */
  function vistaEstadisticas(){
    var total = users().length;
    var mutuos = users().filter(function(u){ return u.follows_viewer; }).length;
    var no = total - mutuos;
    var ratio = (datos.seguidores && datos.seguidos) ? (datos.seguidores/datos.seguidos).toFixed(2) : '—';
    var devuelven = total ? Math.round(mutuos/total*100) + '%' : '—';
    var verif = users().filter(function(u){ return u.is_verified; }).length;
    var priv = users().filter(function(u){ return u.is_private; }).length;
    return banda() +
      '<div class="numeros">' + tarjeta(datos.seguidores,'Seguidores') +
        tarjeta(datos.seguidos,'Siguiendo') + tarjeta(mutuos,'Mutuos','acido') + '</div>' +
      '<div class="numeros">' + tarjeta(ratio,'Ratio seg/sig') +
        tarjeta(no,'No te siguen','rosa') + tarjeta(devuelven,'Te devuelven','acido') + '</div>' +
      '<div class="numeros">' + tarjeta(blanca.size,'Lista blanca','acido') +
        tarjeta(verif,'Verificadas') + tarjeta(priv,'Privadas') + '</div>' +
      '<div class="aviso">De las <b>' + num(total) + '</b> cuentas que seguís, <b>' + num(mutuos) +
      '</b> te siguen de vuelta y <b>' + num(no) + '</b> no. ' +
      'Tenés <b>' + blanca.size + '</b> protegidas en la lista blanca.</div>';
  }

  /* ── ESTRATEGIA ── */
  function vistaEstrategia(){
    var h = (datos.historial || []).slice().sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
    if(h.length < 2){
      return banda() + '<div class="aviso">Hace falta más de una medición para dibujar tu curva. ' +
        'Se va llenando sola cada vez que escaneás desde la computadora.</div>';
    }
    var pri = h[0], ult = h[h.length-1];
    var dif = (ult.f||0) - (pri.f||0);
    var dias = Math.max(1, Math.round(((ult.ts||0)-(pri.ts||0))/86400e3));
    return banda() +
      '<span class="etq">📈 Evolución de seguidores</span>' + grafico(h) +
      '<div class="numeros">' +
        tarjeta((dif>=0?'+':'') + num(dif), 'En ' + dias + ' días', dif>=0?'acido':'rosa') +
        tarjeta((dif/dias).toFixed(1), 'Por día', dif>=0?'acido':'rosa') +
        tarjeta(ult.f, 'Ahora') + '</div>' +
      '<div class="aviso ' + (dif>=0?'acido':'rosa') + '">' +
        (dif > 0 ? 'Venís creciendo. A este ritmo, en un mes sumarías <b>' + num(Math.round(dif/dias*30)) + '</b>.'
         : dif < 0 ? 'Venís bajando <b>' + num(Math.abs(dif)) + '</b> seguidores en ' + dias +
                     ' días. Mirá «Te dejaron» para ver quiénes.'
         : 'Estás estable: mismos seguidores que hace ' + dias + ' días.') + '</div>';
  }
  // Dos líneas sobre una escala común, trazadas a mano. Una curva no justifica
  // traer una librería de 50 KB.
  function grafico(h){
    var W=300, H=110, P=4;
    var fs=h.map(function(x){return x.f||0;}), gs=h.map(function(x){return x.g||0;});
    var min=Math.min.apply(null,fs.concat(gs)), max=Math.max.apply(null,fs.concat(gs));
    if(max===min) max=min+1;
    var x=function(i){ return P + i*(W-2*P)/Math.max(1,h.length-1); };
    var y=function(v){ return H-P-(v-min)*(H-2*P)/(max-min); };
    var linea=function(a){ return a.map(function(v,i){ return (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1); }).join(' '); };
    return '<div class="grafico"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Evolución de seguidores">' +
      '<path d="'+linea(gs)+'" fill="none" stroke="#8b8b8b" stroke-width="2"/>' +
      '<path d="'+linea(fs)+'" fill="none" stroke="#CCFF00" stroke-width="2.5"/>' +
      '</svg><div class="leyenda">' +
        '<span><i style="background:#CCFF00"></i>Seguidores</span>' +
        '<span><i style="background:#8b8b8b"></i>Seguidos</span>' +
      '</div></div>';
  }

  /* ── SIN RESPUESTA ── */
  function vistaMensajes(){
    return banda() + '<div class="aviso rosa">' +
      '<b>Esta es la única que no se puede ver en el teléfono.</b><br><br>' +
      'Leer tus mensajes directos necesita la sesión de Instagram abierta. En iPhone no hay forma de alcanzarla: ' +
      'Apple no permite instalar apps por fuera de su tienda, e Instagram bloquea que una página lea su sesión ' +
      '(responde <b>X-Frame-Options: DENY</b> y no manda cabeceras CORS).<br><br>' +
      'Está disponible en la computadora, en el panel de siempre.</div>';
  }

  function pintar(){
    if(!datos) return;
    $('#pedirClave').className = 'oculto';
    $('#aviso').className = 'aviso oculto';
    $('#vista').className = '';
    pintarPestanas();
    $('#vista').innerHTML =
      pestana === 'seguidores'   ? vistaSeguidores() :
      pestana === 'dejaron'      ? vistaDejaron() :
      pestana === 'historias'    ? vistaHistorias() :
      pestana === 'estadisticas' ? vistaEstadisticas() :
      pestana === 'estrategia'   ? vistaEstrategia() :
                                   vistaMensajes();
  }

  async function traer(){
    var k = clave();
    if(!k) return;
    $('#aviso').className = 'aviso';
    $('#aviso').textContent = 'Buscando lo último que escaneaste…';
    try{
      var r = await fetch(WORKER + '/instagram', { headers:{ authorization:'Bearer '+k }, cache:'no-store' });
      if(r.status === 401){
        guardar(''); $('#pedirClave').className = '';
        $('#aviso').className = 'aviso rosa'; $('#aviso').textContent = 'Esa clave no es correcta. Probá de nuevo.';
        return;
      }
      if(r.status === 404){
        $('#pedirClave').className = 'oculto';
        $('#aviso').className = 'aviso rosa';
        $('#aviso').textContent = 'Todavía no hay nada. Abrí Instagram en la computadora, escaneá y tocá «Ver en el celular».';
        return;
      }
      if(!r.ok) throw new Error('HTTP ' + r.status);
      datos = await r.json();
      cargarBlanca();
      pintar();
    }catch(e){
      $('#aviso').className = 'aviso rosa';
      $('#aviso').textContent = 'No se pudo conectar: ' + e.message;
    }
  }

  /* ── eventos, delegados porque todo se redibuja ── */
  $('#pestanas').addEventListener('click', function(e){
    var b = e.target.closest('[data-p]');
    if(!b) return;
    pestana = b.dataset.p; mostrando = 30; busqueda = '';
    pintar();
  });
  $('#vista').addEventListener('click', function(e){
    var f = e.target.closest('[data-f]');
    if(f){ filtros[f.dataset.f] = !filtros[f.dataset.f]; mostrando = 30; pintar(); return; }
    var m = e.target.closest('[data-m]');
    if(m){ modo = m.dataset.m; mostrando = 30; pintar(); return; }
    var w = e.target.closest('[data-wl]');
    if(w){ tocarBlanca(w.dataset.wl); pintar(); return; }
    if(e.target.id === 'mas'){ mostrando += 100; pintar(); return; }
    if(e.target.id === 'copiar'){
      var lista = [...$('#vista').querySelectorAll('.usuario')].map(function(n){ return n.textContent; }).join('\n');
      navigator.clipboard.writeText(lista).then(function(){
        e.target.textContent = '✓ Copiado';
        setTimeout(function(){ e.target.textContent = 'Copiar lista'; }, 1600);
      }, function(){ e.target.textContent = 'No se pudo'; });
    }
  });
  $('#vista').addEventListener('input', function(e){
    if(e.target.id !== 'buscar') return;
    busqueda = (e.target.value || '').trim().toLowerCase();
    mostrando = 30;
    pintar();
    // Al redibujar se pierde el foco: se devuelve con el cursor al final.
    var c = $('#buscar');
    if(c){ c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
  });

  $('#entrar').onclick = function(){
    var v = ($('#clave').value || '').trim();
    if(!v) return;
    guardar(v); traer();
  };
  $('#clave').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('#entrar').click(); });

  if(clave()){ $('#pedirClave').className = 'oculto'; traer(); }
  else pintarPestanas();
})();
</script>
</body>
</html>
