<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c14">
<title>Panel de Instagram</title>
<!--
  POR QUÉ EXISTE ESTA PÁGINA

  En iPhone no hay forma de LEER Instagram: Apple no deja instalar apps fuera de
  su tienda, y una página web no puede entrar a la sesión de Instagram — probado,
  responde `X-Frame-Options: DENY` y no manda ninguna cabecera CORS.

  Mostrar lo ya leído sí se puede. La computadora escanea y sube el resultado al
  panel privado; esta página lo baja y lo muestra.

  QUÉ PESTAÑAS HAY Y CUÁL FALTA
  Están las cinco que se pueden resolver con una foto del último escaneo:
  seguidores, te dejaron, historias, estadísticas y estrategia. La que NO está es
  "Sin respuesta": leer los mensajes directos necesita la sesión de Instagram
  abierta, y eso en el teléfono no se puede alcanzar. Se dice en pantalla en vez
  de esconderlo.

  EL ASPECTO ES EL DEL PANEL DE VERDAD, no el de la página de instalación. Los
  colores, radios y tipografías salen del CSS del panel (el bloque `.igpp-*` de
  index.html): el degradado de Instagram, no el verde ácido del instalador.
-->
<style>
  :root{
    --fondo:#0a0a12;
    --panel-1:#12121c; --panel-2:#0c0c14;
    --fila:#0d0d16;
    --linea:#26263a; --linea-2:#20202f; --linea-3:#2a2a40;
    --tinta:#f4f4f8; --tenue:#8f8fa3;
    --ig-a:#405de6; --ig-b:#c13584; --ig-c:#f56040;
    --f:system-ui,-apple-system,'Segoe UI',sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--fondo); color:var(--tinta); font-family:var(--f);
    font-size:16px; line-height:1.5; min-height:100dvh;
    padding:max(10px,env(safe-area-inset-top)) 10px calc(env(safe-area-inset-bottom) + 14px);
  }
  .panel{
    background:linear-gradient(180deg,var(--panel-1),var(--panel-2));
    border:1px solid var(--linea); border-radius:22px;
    max-width:920px; margin:0 auto; overflow:hidden;
    display:flex; flex-direction:column; min-height:calc(100dvh - 28px);
  }
  .cabeza{
    padding:16px 20px; display:flex; align-items:center;
    border-bottom:1px solid #232336; background:rgba(255,255,255,.02);
  }
  .logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.2rem}
  .punto{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(45deg,var(--ig-a),var(--ig-b),var(--ig-c));
    box-shadow:0 3px 14px rgba(193,53,132,.5);
  }
  .quien{color:var(--tenue);font-size:.8rem;font-weight:500;margin-top:2px}

  .pestanas{display:flex;gap:5px;padding:11px 14px;border-bottom:1px solid #232336;overflow-x:auto;scrollbar-width:none}
  .pestanas::-webkit-scrollbar{display:none}
  .pestanas button{
    background:none;border:1px solid transparent;color:var(--tenue);
    padding:10px 14px;cursor:pointer;font:700 .9rem var(--f);
    border-radius:12px;white-space:nowrap;transition:all .12s;
  }
  .pestanas button.on{
    color:#fff;border-color:#3a3a55;
    background:linear-gradient(45deg,rgba(64,93,230,.25),rgba(193,53,132,.25));
  }
  .cuerpo{padding:18px 16px;overflow:auto;flex:1}

  .numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}
  .numeros.dos{grid-template-columns:repeat(2,1fr)}
  .stat{
    background:linear-gradient(180deg,#12121e,var(--panel-2));
    border:1px solid var(--linea); border-radius:18px; padding:17px 8px; text-align:center;
  }
  .stat .n{
    font-size:1.85rem;font-weight:800;line-height:1.05;
    background:linear-gradient(45deg,#c4ceff,#ffb0e2);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .stat.rojo .n{background:linear-gradient(45deg,#ff8fb0,#ff3b6b);-webkit-background-clip:text;background-clip:text}
  .stat.verde .n{background:linear-gradient(45deg,#9fe8c0,#2fd98a);-webkit-background-clip:text;background-clip:text}
  .stat .l{color:var(--tenue);font-size:.76rem;margin-top:4px}

  input[type=search],input[type=password]{
    width:100%;padding:12px 15px;border-radius:12px;border:1px solid var(--linea-3);
    background:var(--fila);color:var(--tinta);font:1rem var(--f);outline:none;
  }
  input:focus{border-color:var(--ig-b)}

  .subfiltros{display:flex;gap:6px;margin:12px 0 0;flex-wrap:wrap}
  .subfiltros button{
    background:var(--fila);border:1px solid var(--linea-3);color:var(--tenue);
    padding:8px 13px;border-radius:999px;cursor:pointer;font:600 .82rem var(--f);
  }
  .subfiltros button.on{background:rgba(193,53,132,.18);border-color:rgba(193,53,132,.5);color:#ffc2e6}

  .lista{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .fila{
    display:flex;align-items:center;gap:13px;padding:11px 13px;
    border:1px solid var(--linea-2);border-radius:15px;background:var(--fila);
    text-decoration:none;color:inherit;transition:border-color .12s;
  }
  .fila:hover{border-color:#35354f}
  .av{
    width:46px;height:46px;border-radius:50%;flex:0 0 auto;background:#1c1c2b;
    display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tenue);
  }
  .datos{min-width:0;flex:1}
  .usuario{font-weight:700;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{display:block;color:var(--tenue);font-size:.84rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .insignia{
    background:#1c1c2b;color:#e8e8f0;padding:5px 11px;border-radius:999px;
    font-size:.76rem;font-weight:700;white-space:nowrap;border:1px solid var(--linea-3);flex:0 0 auto;
  }
  .insignia.no{background:rgba(255,59,107,.12);color:#ff8fb0;border-color:rgba(255,59,107,.3)}
  .insignia.si{background:rgba(64,93,230,.15);color:#a9b8ff;border-color:rgba(64,93,230,.35)}
  .insignia.oro{background:rgba(245,96,64,.14);color:#ffc0a8;border-color:rgba(245,96,64,.35)}

  .btn{
    background:#1c1c2b;color:var(--tinta);border:1px solid #2c2c44;border-radius:12px;
    padding:12px 17px;cursor:pointer;font:600 .98rem var(--f);width:100%;margin-top:12px;
  }
  .btn:hover{filter:brightness(1.25)}
  .btn.pri{background:linear-gradient(45deg,var(--ig-a),var(--ig-b));border-color:transparent;font-weight:700}

  .aviso{
    background:rgba(64,93,230,.1);border:1px solid rgba(64,93,230,.3);
    border-radius:15px;padding:14px;font-size:.92rem;color:#c8d2ff;
  }
  .aviso.malo{background:rgba(255,59,107,.1);border-color:rgba(255,59,107,.3);color:#ffb8c8}
  .aviso.gris{background:rgba(255,255,255,.03);border-color:var(--linea-3);color:var(--tenue)}
  .etq{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);font-weight:700;margin-bottom:7px}
  .nota{color:var(--tenue);font-size:.82rem;margin-top:11px;line-height:1.5}
  .vacio{text-align:center;color:var(--tenue);padding:30px 10px}
  .oculto{display:none !important}
  .pie{padding:0 16px 16px}
  .pie a{color:var(--tenue);font-size:.82rem;text-decoration:none}

  h3.titulo{font-size:1rem;font-weight:800;margin:18px 0 2px;display:flex;align-items:center;gap:8px}
  .bajada{color:var(--tenue);font-size:.85rem;margin-bottom:6px}

  /* el gráfico de crecimiento */
  .grafico{background:var(--fila);border:1px solid var(--linea-2);border-radius:16px;padding:14px 12px 8px;margin-top:12px}
  .grafico svg{width:100%;height:150px;display:block;overflow:visible}
  .leyenda{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:.78rem;color:var(--tenue)}
  .leyenda i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

  @media(max-width:420px){
    body{padding-left:6px;padding-right:6px}
    .panel{border-radius:18px}
    .pestanas{padding:9px 8px;gap:3px}
    .pestanas button{padding:9px 9px;font-size:.79rem}
    .cuerpo{padding:15px 12px}
    .numeros{gap:7px}
    .stat{padding:13px 4px;border-radius:15px}
    .stat .n{font-size:1.5rem}
    .stat .l{font-size:.68rem}
    .av{width:41px;height:41px;font-size:.9rem}
  }
</style>
</head>
<body>

<div class="panel">
  <div class="cabeza">
    <div class="logo">
      <span class="punto"></span>
      <span>Panel<div class="quien" id="quien">de Instagram</div></span>
    </div>
  </div>

  <div class="pestanas" id="pestanas"></div>

  <div class="cuerpo">
    <div id="pedirClave">
      <label class="etq" for="clave">Clave de tu panel</label>
      <input type="password" id="clave" placeholder="la misma que usás en Plata" autocomplete="off">
      <button class="btn pri" id="entrar">Entrar</button>
      <p class="nota">Queda guardada en este teléfono. Es la clave de tu Panel, no la contraseña de Instagram.</p>
    </div>

    <div id="aviso" class="aviso oculto"></div>
    <div id="vista" class="oculto"></div>
  </div>

  <div class="pie"><a href="./">‹ Volver a la instalación</a></div>
</div>

<script>
(function(){
  var WORKER = 'https://plata.hamcqc.workers.dev';
  var LS = 'panel-ig-clave';
  var datos = null, pestana = 'seguidores', subfiltro = 'no', mostrando = 50, busqueda = '';

  var $ = function(s){ return document.querySelector(s); };
  function clave(){ try{ return localStorage.getItem(LS) || ''; }catch(e){ return ''; } }
  function guardar(v){ try{ v ? localStorage.setItem(LS, v) : localStorage.removeItem(LS); }catch(e){} }
  function esc(t){
    return String(t == null ? '' : t)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  var num = function(n){ return Number(n).toLocaleString('es-AR'); };

  function avisar(txt, malo){
    var a = $('#aviso');
    a.textContent = txt;
    a.className = 'aviso' + (malo ? ' malo' : '');
  }
  function cuando(iso){
    if(!iso) return '';
    var s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
    if(s < 3600) return 'hace ' + Math.max(1,Math.floor(s/60)) + ' min';
    if(s < 86400) return 'hace ' + Math.floor(s/3600) + ' h';
    var d = Math.floor(s/86400);
    return 'hace ' + d + ' día' + (d > 1 ? 's' : '');
  }
  var users = function(){ return (datos && datos.users) || []; };

  /* ── las pestañas del panel. "Sin respuesta" se muestra desactivada en vez de
        esconderse: si falta sin explicación parece que se rompió algo ── */
  var PESTANAS = [
    { id:'seguidores',  texto:'👥 Seguidores' },
    { id:'dejaron',     texto:'💔 Te dejaron' },
    { id:'historias',   texto:'👁️ Historias' },
    { id:'estadisticas',texto:'📈 Estadísticas' },
    { id:'estrategia',  texto:'🎯 Estrategia' },
    { id:'mensajes',    texto:'💬 Sin respuesta' }
  ];

  function pintarPestanas(){
    $('#pestanas').innerHTML = PESTANAS.map(function(p){
      return '<button data-p="' + p.id + '"' + (p.id === pestana ? ' class="on"' : '') + '>' +
             esc(p.texto) + '</button>';
    }).join('');
  }

  function filaUsuario(u, insignia, claseIns, metaExtra){
    return '<a class="fila" href="https://www.instagram.com/' + encodeURIComponent(u.username) + '/" target="_blank" rel="noopener">' +
      '<div class="av">' + esc((u.username || '?').slice(0,1).toUpperCase()) + '</div>' +
      '<div class="datos">' +
        '<div class="usuario">@' + esc(u.username) + (u.is_verified ? ' ✓' : '') + '</div>' +
        (metaExtra ? '<span class="meta">' + esc(metaExtra) + '</span>'
                   : (u.full_name ? '<span class="meta">' + esc(u.full_name) + '</span>' : '')) +
      '</div>' +
      (insignia ? '<span class="insignia ' + (claseIns||'') + '">' + esc(insignia) + '</span>' : '') +
    '</a>';
  }

  /* ── 👥 Seguidores ── */
  function vistaSeguidores(){
    var lista = users().filter(function(u){
      if(subfiltro === 'no' && u.follows_viewer) return false;
      if(subfiltro === 'si' && !u.follows_viewer) return false;
      if(busqueda && (u.username||'').toLowerCase().indexOf(busqueda) < 0 &&
                     (u.full_name||'').toLowerCase().indexOf(busqueda) < 0) return false;
      return true;
    });
    var noSiguen = datos.noSiguen != null ? datos.noSiguen
      : users().filter(function(u){ return !u.follows_viewer; }).length;

    return '<div class="numeros">' +
        tarjeta(noSiguen, 'No te siguen', 'rojo') +
        tarjeta(datos.seguidores, 'Seguidores') +
        tarjeta(datos.seguidos, 'Seguidos') +
      '</div>' +
      '<input type="search" id="buscar" placeholder="Buscar cuenta…" value="' + esc(busqueda) + '">' +
      '<div class="subfiltros">' +
        sub('no','No te siguen') + sub('si','Te siguen') + sub('todos','Todos') +
      '</div>' +
      listaConMas(lista, function(u){
        return filaUsuario(u, u.follows_viewer ? 'te sigue' : 'no te sigue', u.follows_viewer ? 'si' : 'no');
      });
  }
  function sub(id, texto){
    return '<button data-s="' + id + '"' + (subfiltro === id ? ' class="on"' : '') + '>' + esc(texto) + '</button>';
  }

  /* ── 💔 Te dejaron ── */
  function vistaDejaron(){
    var lista = (datos.perdidos || []).slice().sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
    if(busqueda) lista = lista.filter(function(x){ return (x.u||'').toLowerCase().indexOf(busqueda) >= 0; });

    if(!(datos.perdidos || []).length){
      return '<div class="aviso gris">Todavía no hay registro de nadie que te haya dejado de seguir. ' +
             'Se empieza a llenar cuando escaneás varias veces desde la computadora: compara una lista con la anterior.</div>';
    }
    var ultimaSemana = lista.filter(function(x){ return Date.now() - (x.ts||0) < 7*86400e3; }).length;
    return '<div class="numeros dos">' +
        tarjeta(lista.length, 'Te dejaron', 'rojo') +
        tarjeta(ultimaSemana, 'Esta semana', ultimaSemana ? 'rojo' : '') +
      '</div>' +
      '<input type="search" id="buscar" placeholder="Buscar cuenta…" value="' + esc(busqueda) + '">' +
      listaConMas(lista, function(x){
        return filaUsuario({username:x.u}, null, null, x.ts ? cuando(new Date(x.ts).toISOString()) : '');
      });
  }

  /* ── 👁️ Historias ── */
  function vistaHistorias(){
    var lista = (datos.historias || []).slice();
    if(busqueda) lista = lista.filter(function(x){
      return (x.username||'').toLowerCase().indexOf(busqueda) >= 0 ||
             (x.full_name||'').toLowerCase().indexOf(busqueda) >= 0;
    });
    if(!(datos.historias || []).length){
      return '<div class="aviso gris">Todavía no hay espectadores guardados. ' +
             'Se llenan cuando abrís la pestaña Historias en la computadora, con una historia activa.</div>';
    }
    // Cruzar con la lista de seguidos dice algo que ningún conteo suelto dice:
    // quién te mira las historias sin que vos lo sigas.
    var sigo = {}; users().forEach(function(u){ sigo[(u.username||'').toLowerCase()] = true; });
    var deAfuera = (datos.historias||[]).filter(function(x){ return !sigo[(x.username||'').toLowerCase()]; }).length;
    return '<div class="numeros dos">' +
        tarjeta((datos.historias||[]).length, 'Te vieron') +
        tarjeta(deAfuera, 'Que vos no seguís', 'verde') +
      '</div>' +
      '<input type="search" id="buscar" placeholder="Buscar cuenta…" value="' + esc(busqueda) + '">' +
      listaConMas(lista, function(x){
        return filaUsuario(
          { username:x.username, full_name:x.full_name },
          (x.veces||1) + (x.veces > 1 ? ' historias' : ' historia'),
          x.veces > 2 ? 'oro' : ''
        );
      });
  }

  /* ── 📈 Estadísticas ── */
  function vistaEstadisticas(){
    var total = users().length;
    var mutuos = users().filter(function(u){ return u.follows_viewer; }).length;
    var noSiguen = total - mutuos;
    var ratio = (datos.seguidores && datos.seguidos) ? (datos.seguidores/datos.seguidos).toFixed(2) : '—';
    var devuelven = total ? Math.round(mutuos/total*100) + '%' : '—';

    return '<div class="numeros">' +
        tarjeta(datos.seguidores, 'Seguidores') +
        tarjeta(datos.seguidos, 'Siguiendo') +
        tarjeta(mutuos, 'Mutuos', 'verde') +
      '</div>' +
      '<div class="numeros">' +
        tarjeta(ratio, 'Ratio seg/sig') +
        tarjeta(noSiguen, 'No te siguen', 'rojo') +
        tarjeta(devuelven, 'Te devuelven') +
      '</div>' +
      '<div class="aviso gris" style="margin-top:14px">De las ' + num(total) + ' cuentas que seguís, ' +
        num(mutuos) + ' te siguen de vuelta y ' + num(noSiguen) + ' no. ' +
        'Analizado sobre el escaneo de ' + cuando(datos.escaneadoEn || datos.actualizado) + '.</div>';
  }

  /* ── 🎯 Estrategia ── */
  function vistaEstrategia(){
    var h = (datos.historial || []).slice().sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
    if(h.length < 2){
      return '<div class="aviso gris">Hace falta más de una medición para dibujar tu curva. ' +
             'Se va llenando sola cada vez que escaneás desde la computadora.</div>';
    }
    var primero = h[0], ultimo = h[h.length-1];
    var dif = (ultimo.f||0) - (primero.f||0);
    var dias = Math.max(1, Math.round(((ultimo.ts||0)-(primero.ts||0))/86400e3));

    return '<h3 class="titulo">📈 Evolución de seguidores</h3>' +
      '<p class="bajada">' + h.length + ' mediciones en los últimos ' + dias + ' días.</p>' +
      grafico(h) +
      '<div class="numeros" style="margin-top:14px">' +
        tarjeta((dif >= 0 ? '+' : '') + num(dif), 'En ' + dias + ' días', dif >= 0 ? 'verde' : 'rojo') +
        tarjeta((dif/dias).toFixed(1), 'Por día', dif >= 0 ? 'verde' : 'rojo') +
        tarjeta(ultimo.f, 'Ahora') +
      '</div>' +
      '<div class="aviso gris" style="margin-top:14px">' +
        (dif > 0
          ? 'Venís creciendo. Al ritmo de ' + (dif/dias).toFixed(1) + ' por día, en un mes sumarías ' + num(Math.round(dif/dias*30)) + '.'
          : dif < 0
            ? 'Venís bajando ' + num(Math.abs(dif)) + ' seguidores en ' + dias + ' días. Mirá la pestaña «Te dejaron» para ver quiénes.'
            : 'Estás estable: mismos seguidores que hace ' + dias + ' días.') +
      '</div>';
  }

  // Gráfico de líneas hecho a mano: dos series (seguidores y seguidos) sobre una
  // escala común. Sin librerías — una línea y unos ejes no las necesitan.
  function grafico(h){
    var W = 300, H = 110, P = 4;
    var fs = h.map(function(x){ return x.f||0; });
    var gs = h.map(function(x){ return x.g||0; });
    var min = Math.min.apply(null, fs.concat(gs));
    var max = Math.max.apply(null, fs.concat(gs));
    if(max === min) max = min + 1;
    var x = function(i){ return P + i * (W - 2*P) / Math.max(1, h.length - 1); };
    var y = function(v){ return H - P - (v - min) * (H - 2*P) / (max - min); };
    var linea = function(arr){
      return arr.map(function(v,i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ');
    };
    return '<div class="grafico">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Evolución de seguidores">' +
        '<path d="' + linea(gs) + '" fill="none" stroke="#405de6" stroke-width="2" stroke-linejoin="round" opacity=".65"/>' +
        '<path d="' + linea(fs) + '" fill="none" stroke="#c13584" stroke-width="2.5" stroke-linejoin="round"/>' +
      '</svg>' +
      '<div class="leyenda">' +
        '<span><i style="background:#c13584"></i>Seguidores</span>' +
        '<span><i style="background:#405de6"></i>Seguidos</span>' +
      '</div>' +
    '</div>';
  }

  /* ── 💬 Sin respuesta ── */
  function vistaMensajes(){
    return '<div class="aviso">Esta es la única que no se puede ver en el teléfono.' +
      '<br><br>Leer tus mensajes directos necesita la sesión de Instagram abierta, y en iPhone no hay forma de alcanzarla: ' +
      'Apple no permite instalar apps por fuera de su tienda, e Instagram bloquea que una página lea su sesión.' +
      '<br><br>Está disponible en la computadora, en el panel de siempre.</div>';
  }

  /* ── piezas comunes ── */
  function tarjeta(valor, etiqueta, clase){
    var v = (valor === null || valor === undefined) ? '—' : (typeof valor === 'number' ? num(valor) : valor);
    return '<div class="stat ' + (clase||'') + '"><div class="n">' + esc(v) + '</div>' +
           '<div class="l">' + esc(etiqueta) + '</div></div>';
  }
  function listaConMas(lista, pintarUno){
    var visibles = lista.slice(0, mostrando);
    var faltan = lista.length - mostrando;
    return '<div class="lista">' +
        (visibles.length ? visibles.map(pintarUno).join('') : '<div class="vacio">Nada que mostrar acá.</div>') +
      '</div>' +
      (faltan > 0 ? '<button class="btn" id="mas">Ver ' + Math.min(100, faltan) + ' más</button>' : '') +
      (lista.length ? '<p class="nota">Mostrando ' + num(visibles.length) + ' de ' + num(lista.length) + '.</p>' : '');
  }

  function pintar(){
    if(!datos) return;
    $('#pedirClave').className = 'oculto';
    $('#aviso').className = 'aviso oculto';
    $('#vista').className = '';

    $('#quien').textContent =
      (datos.usuario ? '@' + datos.usuario + ' · ' : '') +
      'escaneado ' + cuando(datos.escaneadoEn || datos.actualizado);

    pintarPestanas();
    var html =
      pestana === 'seguidores'   ? vistaSeguidores() :
      pestana === 'dejaron'      ? vistaDejaron() :
      pestana === 'historias'    ? vistaHistorias() :
      pestana === 'estadisticas' ? vistaEstadisticas() :
      pestana === 'estrategia'   ? vistaEstrategia() :
                                   vistaMensajes();
    $('#vista').innerHTML = html;
  }

  async function traer(){
    var k = clave();
    if(!k) return;
    avisar('Buscando lo último que escaneaste…');
    try{
      var r = await fetch(WORKER + '/instagram', {
        headers: { authorization: 'Bearer ' + k }, cache: 'no-store'
      });
      if(r.status === 401){
        guardar('');
        avisar('Esa clave no es correcta. Probá de nuevo.', true);
        $('#pedirClave').className = '';
        return;
      }
      if(r.status === 404){
        avisar('Todavía no hay nada para mostrar. Abrí Instagram en la computadora, escaneá y tocá «Ver en el celular».', true);
        $('#pedirClave').className = 'oculto';
        return;
      }
      if(!r.ok) throw new Error('HTTP ' + r.status);
      datos = await r.json();
      pintar();
    }catch(e){
      avisar('No se pudo conectar: ' + e.message, true);
    }
  }

  /* ── eventos, delegados porque todo se redibuja ── */
  $('#pestanas').addEventListener('click', function(e){
    var b = e.target.closest('[data-p]');
    if(!b) return;
    pestana = b.dataset.p; mostrando = 50; busqueda = '';
    pintar();
  });
  $('#vista').addEventListener('click', function(e){
    var s = e.target.closest('[data-s]');
    if(s){ subfiltro = s.dataset.s; mostrando = 50; pintar(); return; }
    if(e.target.id === 'mas'){ mostrando += 100; pintar(); }
  });
  $('#vista').addEventListener('input', function(e){
    if(e.target.id !== 'buscar') return;
    busqueda = (e.target.value || '').trim().toLowerCase();
    mostrando = 50;
    pintar();
    // Al redibujar se pierde el foco: se devuelve con el cursor al final para
    // poder seguir escribiendo sin volver a tocar el campo.
    var c = $('#buscar');
    if(c){ c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
  });

  $('#entrar').onclick = function(){
    var v = ($('#clave').value || '').trim();
    if(!v) return;
    guardar(v);
    traer();
  };
  $('#clave').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('#entrar').click(); });

  if(clave()){ $('#pedirClave').className = 'oculto'; traer(); }
  else pintarPestanas();
})();
</script>
</body>
</html>
