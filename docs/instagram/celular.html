<!doctype html>
<html lang="es">
<head>

<title>Panel de Instagram — instalar</title>
<meta name="theme-color" content="#000000">
<!-- Sólo texto, enlaces, un poco de código para llevar la cuenta de los pasos
     y el pedido de marcador.txt (mismo sitio) para copiar el panel. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<style>
:root{
  --acido:#CCFF00;
  --magenta:#FF2D7A;
  --apagado:#8b8b8b;
  --f:ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{background:#000}
body{
  color:#fff; font-family:var(--f); font-size:17px; line-height:1.5;
  padding:max(1.2rem, env(safe-area-inset-top)) 1.3rem calc(env(safe-area-inset-bottom) + 2rem);
  max-width:28rem; margin:0 auto; min-height:100vh;
  display:flex; flex-direction:column;
}
a{color:var(--acido)}
b{color:#fff}

/* ── cabecera ── */
.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:1.3rem}
.logo{font-weight:900;font-size:.9rem;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.logo i{display:inline-block;width:.7em;height:.7em;background:var(--acido);margin-right:.45em;vertical-align:-.02em}
.disp{font-size:.68rem;font-weight:800;letter-spacing:.06em;border:2px solid #fff;padding:.2em .5em;white-space:nowrap;text-transform:uppercase}

/* ── progreso ── */
.prog{display:flex;gap:6px;margin-bottom:.5rem}
.prog i{flex:1;height:6px;background:#2b2b2b}
.prog i.on{background:var(--acido)}
.pn{font-size:.72rem;font-weight:800;color:var(--acido);letter-spacing:.14em;margin-bottom:1.3rem;text-transform:uppercase}

/* ── contenido de cada paso ── */
h1{font-size:clamp(1.8rem,9vw,2.25rem);line-height:1.02;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:.9rem}
h1 em{font-style:normal;color:var(--magenta)}
.txt{font-size:1rem;color:#cfcfcf;margin-bottom:1.3rem}

.app{display:flex;gap:.85rem;align-items:center;border:2px solid #fff;padding:.75rem;margin-bottom:1.3rem}
.ico{width:3.4rem;height:3.4rem;flex:none;display:grid;place-items:center;font-weight:900;font-size:1.3rem;border-radius:.8rem}
.app .n{font-weight:800;font-size:1.02rem;line-height:1.2}
.app .s{font-size:.8rem;color:#aaa}
.gratis{margin-left:auto;font-size:.66rem;font-weight:900;background:var(--acido);color:#000;padding:.2em .45em}

.ruta{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:0 0 1.3rem}
.chip{border:2px solid #fff;padding:.35em .6em;font-weight:800;font-size:.9rem}
.chip.fin{background:var(--acido);color:#000;border-color:var(--acido)}
.fl{color:var(--magenta);font-weight:900}

.lista{border:2px solid #333;background:#0b0b0b;padding:.8rem .9rem;margin-bottom:1.3rem;list-style:none}
.lista li{display:flex;gap:.7rem;align-items:flex-start;font-size:.95rem;color:#ddd;margin:.35rem 0}
.lista li + li{border-top:1px solid #222;padding-top:.7rem;margin-top:.7rem}
.lista .num{width:1.5rem;height:1.5rem;flex:none;background:var(--magenta);color:#000;font-weight:900;display:grid;place-items:center;font-size:.8rem;margin-top:.05rem}
.lista .cont{flex:1;min-width:0}
/* dibujo de dónde tocar, debajo de cada acción */
.dib{display:block;width:100%;height:auto;margin-top:.55rem}

/* ── botones ── */
.btn,.sec{display:block;width:100%;text-align:center;text-decoration:none;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;font-family:var(--f)}
.btn{background:var(--acido);color:#000;border:2px solid var(--acido);font-weight:900;font-size:1.05rem;padding:1.05rem .6rem;margin-bottom:.75rem}
.sec{background:#000;color:#fff;border:2px solid #fff;font-weight:800;font-size:.9rem;padding:.85rem .6rem;margin-bottom:.75rem}
.btn:active,.sec:active{transform:translateY(1px)}

.atras{background:none;border:0;color:var(--apagado);font-family:var(--f);font-size:.85rem;text-decoration:underline;cursor:pointer;padding:.3rem 0}
.pie{margin-top:auto;padding-top:1.6rem;font-size:.8rem;color:#777;text-align:center;line-height:1.5}
.pie button{background:none;border:0;color:var(--apagado);font:inherit;text-decoration:underline;cursor:pointer}
.aviso{font-size:.85rem;color:var(--apagado);margin:.2rem 0 1rem;text-align:center}
.aviso b{color:#fff}

/* ── listo ── */
.ok{width:6rem;height:6rem;background:var(--acido);color:#000;display:grid;place-items:center;font-size:3.6rem;font-weight:900;margin:1.6rem auto 1.4rem}
.centro{text-align:center}

/* ── elegir aparato ── */
.elegir .sec{text-align:left;padding:1rem;font-size:1rem;text-transform:none;letter-spacing:0}
</style>

<div class="top">
  <div class="logo"><i></i>Panel de Instagram</div>
  <div class="disp" id="disp"></div>
</div>

<main id="paso"></main>

<div class="pie" id="pie"></div>

<noscript><p class="txt">Para instalar el panel hace falta tener JavaScript prendido.</p></noscript>

<script>
/* ── ¿hay una versión más nueva publicada? ──────────────────────────────
   GitHub Pages deja guardada cada página 10 minutos, y Chrome de Android no
   recarga una pestaña que quedó abierta: sin esto, alguien podía seguir viendo
   el asistente viejo aunque ya hubiera uno nuevo. Al abrir y al volver a la
   pestaña se compara con version.txt (sin caché); si cambió, se recarga con la
   versión en la dirección, así el navegador no usa la copia guardada.
   Subí el número en version.txt Y acá cada vez que cambie esta página. */
(function () {
  var ESTA = "6";
  var raiz = document.documentElement;
  function mostrar() { raiz.style.visibility = ""; }
  // Al abrir, la página no se ve hasta saber si es la última: así nunca aparece
  // un instante la versión vieja antes de recargarse. Tope 1,5 s por si no hay red.
  function revisar(alAbrir) {
    fetch("version.txt", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (v) {
        v = (v || "").trim();
        if (!v || v === ESTA) { mostrar(); return; }
        var marca = "igpp_recargado_" + v;
        try { if (sessionStorage.getItem(marca)) { mostrar(); return; } sessionStorage.setItem(marca, "1"); } catch (e) {}
        var u = new URL(location.href);
        u.searchParams.set("v", v);
        location.replace(u.href);
      })
      .catch(mostrar);
  }
  raiz.style.visibility = "hidden";
  setTimeout(mostrar, 1500);
  revisar();
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") revisar(); });
  window.addEventListener("pageshow", function (e) { if (e.persisted) revisar(); });
})();
</script>
<script>
(function () {
  /* ── Asistente de instalación ────────────────────────────────────────
     Un paso por pantalla, sólo los del aparato desde el que se abre.
     - Se acuerda del paso (localStorage): si la persona se va al App Store,
       a Ajustes o a Firefox y vuelve, sigue donde estaba.
     - Se da cuenta sola de que el panel quedó instalado: el userscript
       (y la extensión) dejan data-panel-instalado en esta página.
     - Con ?abrir, si el panel ya está puesto, va directo a Instagram. */

  var USERSCRIPT = "panel.user.js";
  var INSTAGRAM  = "https://www.instagram.com/?igpp=abrir";

  // Con un "intent" que nombra a Chrome, Android se lo da a Chrome y se abre en
  // una pestaña nueva. Si no hay Chrome, cae en la dirección común.
  var IG_EN_CHROME = "intent://www.instagram.com/#Intent;scheme=https;package=com.android.chrome;" +
                     "S.browser_fallback_url=https%3A%2F%2Fwww.instagram.com%2F;end";
  var LINKS = {
    userscriptsIOS: "https://apps.apple.com/app/userscripts/id1463298887",
    firefoxAndroid: "https://play.google.com/store/apps/details?id=org.mozilla.firefox",

    vmChrome:       "https://chromewebstore.google.com/detail/violentmonkey/jinjaccalgkegednnccohejagnlnfdag"
  };

  var ua = navigator.userAgent;
  var esIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var esAndroid = /Android/.test(ua);
  var esFirefox = /Firefox|FxiOS/.test(ua);
  var esMacSafari = !esIOS && /Macintosh/.test(ua) && /Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(ua);
  var abrir = /[?&]abrir(=|&|$)/.test(location.search);

  function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  var aparato = leer("igpp_asistente_aparato") ||
    (esIOS ? "ios" : esAndroid ? "android" : esMacSafari ? "mac" : "pc");

  var NOMBRES = { ios: "🍎 iPhone", android: "🤖 Android", pc: "💻 Compu", mac: "💻 Mac" };

  function appBox(ico, fondo, nombre, tienda) {
    return '<div class="app"><div class="ico" style="background:' + fondo + '">' + ico + '</div>' +
      '<div><div class="n">' + nombre + '</div><div class="s">' + tienda + '</div></div>' +
      '<div class="gratis">GRATIS</div></div>';
  }
  function ruta(items) {
    return '<div class="ruta">' + items.map(function (t, i) {
      return '<span class="chip' + (i === items.length - 1 ? ' fin' : '') + '">' + t + '</span>';
    }).join('<span class="fl">›</span>') + '</div>';
  }
  // Cada acción puede ser un texto o {t: texto, img: dibujo}.
  function lista(items) {
    return '<ol class="lista">' + items.map(function (it, i) {
      var texto = typeof it === "string" ? it : it.t;
      var dibujo = typeof it === "string" ? "" : (it.img || "");
      return '<li><span class="num">' + (i + 1) + '</span><div class="cont">' + texto + dibujo + '</div></li>';
    }).join('') + '</ol>';
  }

  /* ── Dibujos de dónde tocar ─────────────────────────────────────────
     Son esquemas, no capturas: se dibujan acá siguiendo las guías oficiales
     de Apple (Safari en iOS 26: el botón "Más" •••) y de Google (Chrome en

     usar en una página pública. El círculo rosa marca dónde tocar. */

    return '<svg class="dib" viewBox="0 0 320 ' + alto + '" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +

  }

  }
  function caja(x, y, w, h, o) {
    o = o || {};
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (o.rx || 0) + '" fill="' + (o.f || GRIS) + '"' +
      (o.s ? ' stroke="' + o.s + '" stroke-width="' + (o.sw || 2) + '"' : '') + '/>';
  }

  }
  function marco(x, y, w, h) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="none" stroke="' + ROSA + '" stroke-width="4"/>';
  }
  // Cartelito "TOCÁ" con una línea hasta el lugar.
  function cartel(x, y, texto, hx, hy) {
    var w = texto.length * 7.4 + 18;
    return (hx !== undefined ? '<line x1="' + (x + w / 2) + '" y1="' + (y + 11) + '" x2="' + hx + '" y2="' + hy + '" stroke="' + ROSA + '" stroke-width="3"/>' : '') +
      caja(x, y, w, 22, { f: ROSA }) + tx(x + w / 2, y + 15.5, 12, texto, { c: "#000", w: 900, a: "middle" });
  }
  function numero(x, y, n) {
    return '<circle cx="' + x + '" cy="' + y + '" r="11" fill="' + ROSA + '"/>' + tx(x, y + 4.5, 13, n, { c: "#000", w: 900, a: "middle" });

  var DIB = {

      '<circle cx="283" cy="123" r="17" fill="' + GRIS + '"/>' + tx(283, 128, 15, "•••", { a: "middle", w: 900 }) +
      aro(283, 123, 25) + cartel(170, 20, "TOCÁ •••", 276, 98)),

      caja(40, 114, 150, 8, { f: "#333" }) + caja(40, 138, 100, 8, { f: "#333" }) +

    // iPhone: pantalla de Agregar marcador con Guardar
    iosGuardar: lienzo(150,
      tx(20, 34, 13, "Cancelar", { c: "#4da3ff", w: 500 }) + tx(160, 34, 13, "Agregar marcador", { a: "middle", w: 800 }) +
      tx(300, 34, 13, "Guardar", { c: "#4da3ff", w: 800, a: "end" }) + aro(271, 29, 38, 17) + numero(271, 62, "2") +

      caja(40, 34, 140, 8, { f: "#333" }) +
      tx(44, 80, 15, "📖  Marcadores") + marco(30, 58, 260, 34) +

      cartel(196, 100, "TOCÁ ACÁ", 250, 92)),

      tx(290, 110, 16, "↻", { c: "#cfcfd4", a: "middle" }) + aro(180, 104, 16) + numero(180, 136, "2") +
      caja(136, 152, 130, 7, { f: "#3a3a3c" })),

    // Android: aviso de abajo con EDITAR
    androidEditar: lienzo(130,

      caja(12, 102, 296, 30, { f: "#161618" }) + tx(28, 122, 13, "🔍  panel", { c: "#9a9a9f", w: 500 }) +
      cartel(120, 140, "TOCÁ EL DE LA ESTRELLITA", 160, 98)),

    // Android: ⋮ → Favoritos
    androidMenuFavoritos: lienzo(180,
      caja(12, 14, 250, 34, { rx: 17, f: GRIS }) + tx(30, 36, 12, "🔒 instagram.com", { c: "#cfcfd4", w: 500 }) +

  /* Cada paso: titulo y cuerpo (HTML), boton {texto, href, avanza}, secundario.

                ruta(['Safari', 'Ajustes', 'Extensiones', 'Userscripts ✓', 'Permitir siempre']),
        boton: { texto: 'Ya la prendí →' },
        pie: 'Si preferís Chrome, Brave o Edge, tocá "Cambiar de aparato" abajo y elegí Compu.' },
      { titulo: 'Instalá el <em>panel</em>',
        cuerpo: '<p class="txt">Tocá el botón y después:</p>' +
                lista(['Tocá el ícono de <b>Userscripts</b> en la barra de Safari', 'Tocá <b>Install</b>', 'Volvé a esta pestaña']),
        boton: { texto: 'Instalar el panel', href: USERSCRIPT },
        instalar: true,
        pie: 'Cuando vuelvas, esta página se da cuenta sola de que quedó instalado.' }
    ]
  };

  var instalado = false;
  var elPaso = document.getElementById("paso");
  var elPie = document.getElementById("pie");
  document.getElementById("disp").textContent = NOMBRES[aparato];

  function clave() { return "igpp_asistente_paso_" + aparato; }
  function pasoActual() {
    var n = parseInt(leer(clave()) || "0", 10) || 0;
    var total = PASOS[aparato].length;
    // En Android, si ya se está en Firefox, el paso de bajar Firefox no aplica.
    if (aparato === "android" && esFirefox && n === 0) n = 1;
    return Math.max(0, Math.min(n, total - 1));
  }
  function irA(n) { guardar(clave(), String(n)); pintar(); window.scrollTo(0, 0); }

  function pintar() {
    if (instalado) { pintarListo(); return; }
    var pasos = PASOS[aparato];
    var n = pasoActual();
    var p = pasos[n];

    var html = '<div class="prog">' + pasos.map(function (_, i) {
      return '<i' + (i <= n ? ' class="on"' : '') + '></i>';
    }).join('') + '</div><div class="pn">Paso ' + (n + 1) + ' de ' + pasos.length + '</div>';

    html += '<h1>' + p.titulo + '</h1>' + p.cuerpo;
    html += p.boton.href
      ? '<a class="btn" id="principal" href="' + p.boton.href + '"' +
        (p.boton.href === USERSCRIPT || /^intent:/.test(p.boton.href) ? '' : ' target="_blank" rel="noopener"') + '>' + p.boton.texto + '</a>'
      : '<button class="btn" id="principal">' + p.boton.texto + '</button>';
    if (p.aviso) html += '<p class="aviso">' + p.aviso + '</p>';
    if (p.copiar) html += '<button class="sec" id="copiar">Copiar el link de esta página</button>';
    if (p.secundario) html += p.secundarioHref
      ? '<a class="sec" id="secundario" href="' + p.secundarioHref + '">' + p.secundario + '</a>'
      : '<button class="sec" id="secundario">' + p.secundario + '</button>';
    if (p.instalar) html += '<p class="aviso">¿Ya lo instalaste y no avanza? <a href="#" id="recargar">Tocá acá para comprobar</a></p>';
    if (n > 0) html += '<button class="atras" id="atras">← Volver al paso anterior</button>';
    elPaso.innerHTML = html;

    elPie.innerHTML = (p.pie ? p.pie + '<br><br>' : '') +
      '¿No es tu aparato? <button id="cambiar">Cambiar de aparato</button>';

    var principal = document.getElementById("principal");
    principal.addEventListener("click", function (ev) {
      if (p.boton.accion === "copiarPanel") {
        ev.preventDefault();
        copiarPanel(principal, function () { setTimeout(function () { irA(n + 1); }, 900); });
        return;
      }
      if (!p.boton.href) { ev.preventDefault(); irA(n + 1); return; }
      // Se deja ir al enlace y, por detrás, queda anotado el paso siguiente.
      if (p.boton.avanza) setTimeout(function () { irA(n + 1); }, 400);
    });
    var sec = document.getElementById("secundario");
    if (sec && !p.secundarioHref) sec.addEventListener("click", function () {
      if (p.secundarioAccion === "copiarPanel") copiarPanel(sec);
      else irA(n + 1);
    });
    var atras = document.getElementById("atras");
    if (atras) atras.addEventListener("click", function () { irA(n - 1); });
    var cop = document.getElementById("copiar");
    if (cop) cop.addEventListener("click", function () { copiarLink(cop); });
    var rec = document.getElementById("recargar");
    if (rec) rec.addEventListener("click", function (ev) { ev.preventDefault(); location.reload(); });
    document.getElementById("cambiar").addEventListener("click", pintarElegir);
  }

  function pintarElegir() {
    var opciones = [["ios", "🍎 iPhone o iPad"], ["android", "🤖 Android"],
                    ["pc", "💻 Compu (Chrome, Brave, Edge, Firefox)"], ["mac", "💻 Mac con Safari"]];
    elPaso.innerHTML = '<h1>¿Desde qué <em>aparato</em>?</h1><p class="txt">Elegí dónde vas a usar el panel.</p>' +
      '<div class="elegir">' + opciones.map(function (o) {
        return '<button class="sec" data-a="' + o[0] + '">' + o[1] + '</button>';
      }).join('') + '</div>';
    elPie.innerHTML = '';
    Array.prototype.forEach.call(elPaso.querySelectorAll("[data-a]"), function (b) {
      b.addEventListener("click", function () {
        aparato = b.getAttribute("data-a");
        guardar("igpp_asistente_aparato", aparato);
        document.getElementById("disp").textContent = NOMBRES[aparato];
        pintar();
      });
    });
  }

  function pintarListo() {
    var donde = aparato === "ios" || aparato === "mac" ? "Safari" : aparato === "android" ? "Firefox" : "este navegador";
    elPaso.innerHTML =
      '<div class="ok">✓</div><div class="centro">' +
      '<h1>¡Listo, ya <em>lo tenés</em>!</h1>' +
      '<p class="txt">De ahora en más abrís <b>instagram.com</b> en ' + donde + ' y tocás el botón <b>◐</b> de abajo a la derecha.</p></div>' +
      '<div style="margin:0 0 1.2rem">' + DIB.igBoton + '</div>' +
      '<a class="btn" href="' + INSTAGRAM + '">Abrir Instagram</a>' +
      (aparato === "ios" ? '<p class="aviso">Si se te abre la app de Instagram, volvé acá, <b>mantené apretado</b> el botón y elegí <b>Abrir</b>.</p>' : '');
    elPie.innerHTML = 'Tiene que ser ' + donde + (aparato === "ios" || aparato === "android" ? ', no la app de Instagram' : '') + '.<br>Se actualiza solo.';
  }

  /* ── copiar ── */
  // Respaldo para cuando el portapapeles moderno no deja: iOS ignora un
  // textarea readonly y necesita la selección hecha con un Range.
  function copiarViejo(t) {
    try {
      var a = document.createElement("textarea");
      a.value = t; a.contentEditable = "true"; a.readOnly = false;
      a.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
      document.body.appendChild(a);
      var rango = document.createRange(); rango.selectNodeContents(a);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rango);
      a.setSelectionRange(0, t.length);
      var ok = document.execCommand("copy");
      sel.removeAllRanges(); document.body.removeChild(a);
      return ok;
    } catch (e) { return false; }
  }
  function copiar(texto, alTerminar) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () { alTerminar(true); },
        function () { alTerminar(copiarViejo(texto)); });
    } else { alTerminar(copiarViejo(texto)); }
  }
  function copiarLink(boton) {
    copiar(location.origin + location.pathname, function (ok) {
      boton.textContent = ok ? "✓ Link copiado" : "No se pudo copiar: copialo de la barra de arriba";
    });
  }

  // El panel para el marcador se baja al abrir la página, así al tocar el
  // botón se copia en el mismo toque: iOS no deja copiar si antes hay que
  // esperar una descarga.
  var marcador = null;
  fetch("marcador.txt", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (t) { marcador = t.trim(); })
    .catch(function () { marcador = ""; });

  function copiarPanel(boton, alCopiar) {
    var original = boton.textContent;
    if (marcador === null) { boton.textContent = "Cargando… tocá de nuevo"; return; }
    if (!marcador) { boton.textContent = "No se pudo cargar: recargá la página"; return; }
    copiar(marcador, function (ok) {
      if (ok) { boton.textContent = "✓ Panel copiado"; if (alCopiar) alCopiar(); }
      else {
        boton.textContent = "No se pudo copiar, tocá de nuevo";
        setTimeout(function () { boton.textContent = original; }, 2500);
      }
    });
  }

  /* ── ¿ya está instalado? ── */
  function marcarInstalado() {
    if (instalado) return;
    instalado = true;
    if (abrir) { location.replace(INSTAGRAM); return; }
    pintar();
  }
  function revisar() {
    if (document.documentElement.getAttribute("data-panel-instalado")) { marcarInstalado(); return true; }
    return false;
  }
  document.addEventListener("panel-instagram-listo", marcarInstalado);
  if (!revisar()) {
    // Sin ventana de tiempo: el gestor puede inyectar tarde (ver index.html).
    var obs = new MutationObserver(function () { if (revisar()) obs.disconnect(); });
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ["data-panel-instalado"] });
  }
  // Volver con "atrás" puede restaurar la página de la memoria sin que el
  // gestor la vuelva a mirar: se recarga para que la detección corra de nuevo.
  window.addEventListener("pageshow", function (e) { if (e.persisted && !instalado) location.reload(); });

  pintar();
})();
