<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda · Panel</title>
<meta name="description" content="Turnos, pagos, entregas y fechas, todas juntas.">
<meta name="theme-color" content="#07100e">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="apple-touch-icon" href="../iconos/panel-180.png">
<link rel="icon" href="../iconos/panel-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#07100e; --panel:#0e1a17; --linea:#1d2f2a; --texto:#eafff7; --tenue:#8fb3a8;
  --ac:#4df0b4; --ac2:#ffd23f;
  --turno:#4de3ff; --pago:#ffd23f; --entrega:#ff5d8f; --facultad:#b08cff; --otro:#8fb3a8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--texto);font-family:Archivo,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding:max(14px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
a{color:inherit}
.top{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.volver{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--tenue);text-decoration:none;border:1px solid var(--linea);
  border-radius:999px;padding:6px 12px}
h1{font-size:30px;font-weight:900;letter-spacing:-.02em;margin:0}
.sub{color:var(--tenue);font-size:13px;margin:2px 0 0}
.wrap{max-width:720px;margin:0 auto}

/* clave */
#claveCaja{display:none;background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:16px;margin:0 0 16px}
#claveCaja.ver{display:block}
#claveCaja p{margin:0 0 10px;color:var(--tenue);font-size:14px}
.fila{display:flex;gap:8px}
input,select,textarea{background:#0a1512;border:1px solid var(--linea);color:var(--texto);border-radius:12px;
  padding:11px 12px;font:inherit;font-size:15px;width:100%}
input::placeholder,textarea::placeholder{color:#55736b}
.btn{background:var(--ac);color:#04120d;border:0;border-radius:12px;padding:11px 16px;font-weight:800;font-size:15px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--texto);border:1px solid var(--linea);font-weight:600}

/* calendario */
.cal{background:var(--panel);border:1px solid var(--linea);border-radius:18px;padding:14px;margin:0 0 16px}
.caltop{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.caltop h2{margin:0;font-size:19px;font-weight:800;text-transform:capitalize}
.nav{display:flex;gap:6px}
.nav button{background:#0a1512;border:1px solid var(--linea);color:var(--texto);border-radius:10px;width:36px;height:36px;font-size:17px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--tenue);font-size:11px;font-family:"IBM Plex Mono",monospace;padding:2px 0 4px;text-transform:uppercase}
.celda{aspect-ratio:1;border:1px solid transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:14px;color:var(--texto);cursor:default;position:relative}
.celda.mes{background:#0a1512;border-color:var(--linea);cursor:pointer}
.celda.hoy{outline:2px solid var(--ac);outline-offset:-2px}
.celda.sel{background:#13261f;border-color:var(--ac)}
.celda .pts{display:flex;gap:2px;height:6px}
.celda .pt{width:6px;height:6px;border-radius:50%}

/* lista */
.listahdr{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.listahdr h2{margin:0;font-size:18px;font-weight:800}
.ev{background:var(--panel);border:1px solid var(--linea);border-left:4px solid var(--otro);border-radius:14px;padding:12px 14px;margin:0 0 9px;position:relative}
.ev .cab{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.ev .tit{font-weight:800;font-size:16px}
.ev .cuando{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ac);white-space:nowrap}
.ev .meta{color:var(--tenue);font-size:13.5px;margin:4px 0 0;line-height:1.45}
.ev .meta b{color:var(--texto);font-weight:600}
.ev .chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 7px;border-radius:999px;border:1px solid var(--linea);color:var(--tenue);margin:0 6px 0 0}
.ev .borrar{position:absolute;top:10px;right:10px;background:transparent;border:0;color:#5a7a70;font-size:16px;cursor:pointer}
.vacio{color:var(--tenue);text-align:center;padding:26px 10px;font-size:14px}
.mini{color:var(--tenue);font-size:12px;font-family:"IBM Plex Mono",monospace}

/* agregar */
details.add{margin:14px 0 0;background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:0 14px}
details.add>summary{list-style:none;cursor:pointer;padding:13px 0;font-weight:700;color:var(--ac)}
details.add>summary::-webkit-details-marker{display:none}
.form{display:grid;gap:9px;padding:0 0 16px}
.form .dos{display:grid;grid-template-columns:1fr 110px;gap:9px}
.form label{font-size:12px;color:var(--tenue);margin:0 0 -4px}
.estado{font-size:13px;color:var(--tenue);min-height:18px;margin:8px 0 0}
.estado.ok{color:var(--ac)} .estado.err{color:#ff7a90}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="volver" href="../">← Panel</a>
    <div><h1>Agenda</h1><p class="sub">Turnos, pagos, entregas y fechas. Todo junto.</p></div>
  </div>

  <div id="claveCaja">
    <p>Esta agenda es privada: vive en tu Worker, detrás de tu clave. Es la misma del panel de Plata.</p>
    <div class="fila">
      <input id="claveIn" type="password" placeholder="clave del panel" autocomplete="off">
      <button class="btn" id="claveOk">Entrar</button>
    </div>
  </div>

  <section class="cal" id="calBox" hidden>
    <div class="caltop">
      <h2 id="mesTit">—</h2>
      <div class="nav">
        <button id="prev" aria-label="Mes anterior">‹</button>
        <button id="hoy" aria-label="Hoy" style="width:auto;padding:0 12px;font-size:13px">hoy</button>
        <button id="next" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="dias"></div>
  </section>

  <div class="listahdr"><h2 id="listaTit">Próximo</h2><span class="mini" id="cont"></span></div>
  <div id="lista"></div>

  <details class="add">
    <summary>+ Agregar un evento a mano</summary>
    <div class="form">
      <div><label>Título</label><input id="fTit" placeholder="Ej: Turno otorrino"></div>
      <div class="dos">
        <div><label>Fecha</label><input id="fFecha" type="date"></div>
        <div><label>Hora</label><input id="fHora" type="time"></div>
      </div>
      <div class="dos">
        <div><label>Tipo</label><select id="fTipo">
          <option value="turno">Turno médico</option><option value="pago">Pago</option>
          <option value="entrega">Entrega</option><option value="facultad">Facultad</option>
          <option value="otro">Otro</option></select></div>
        <div><label>Origen</label><input id="fOrigen" placeholder="chat"></div>
      </div>
      <div><label>Lugar</label><input id="fLugar" placeholder="opcional"></div>
      <div><label>Notas</label><textarea id="fNotas" rows="2" placeholder="opcional"></textarea></div>
      <button class="btn" id="fGuardar">Guardar evento</button>
    </div>
  </details>

  <p class="estado" id="estado"></p>
</div>

<script>
const WORKER = 'https://plata.hamcqc.workers.dev';
const LS_CLAVE = 'plata-mp-clave';
const TIPOS = {turno:'--turno',pago:'--pago',entrega:'--entrega',facultad:'--facultad',otro:'--otro'};
const TIPO_TXT = {turno:'turno',pago:'pago',entrega:'entrega',facultad:'facultad',otro:'otro'};
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW = ['L','M','M','J','V','S','D'];
const $ = s => document.querySelector(s);

let clave = '';
try { clave = localStorage.getItem(LS_CLAVE) || ''; } catch(e){}
let eventos = [];
let cursor = new Date(); cursor.setDate(1);
let sel = iso(new Date());

function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function color(t){ return getComputedStyle(document.documentElement).getPropertyValue(TIPOS[t]||'--otro').trim(); }
function estado(msg, cls){ const e=$('#estado'); e.textContent=msg||''; e.className='estado'+(cls?' '+cls:''); }

function pedirClave(ver){ $('#claveCaja').classList.toggle('ver', ver); }
$('#claveOk').onclick = () => {
  const v = $('#claveIn').value.trim(); if(!v) return;
  clave = v; try{ localStorage.setItem(LS_CLAVE, v); }catch(e){}
  pedirClave(false); cargar();
};

async function cargar(){
  if(!clave){ pedirClave(true); return; }
  estado('Cargando…');
  try{
    const r = await fetch(WORKER+'/agenda', { headers:{ authorization:'Bearer '+clave }, cache:'no-store' });
    if(r.status===401){ clave=''; try{localStorage.removeItem(LS_CLAVE);}catch(e){} pedirClave(true); estado('Clave incorrecta.','err'); return; }
    const data = await r.json();
    eventos = (data.eventos||[]).slice();
    $('#calBox').hidden = false;
    estado(''); render();
  }catch(e){ estado('No se pudo conectar: '+e.message,'err'); }
}

async function guardar(ev){
  if(!clave){ pedirClave(true); return false; }
  const r = await fetch(WORKER+'/agenda', { method:'POST',
    headers:{ 'content-type':'application/json', authorization:'Bearer '+clave },
    body: JSON.stringify({ evento: ev }) });
  return r.ok;
}
async function borrar(id){
  if(!confirm('¿Borrar este evento?')) return;
  const r = await fetch(WORKER+'/agenda', { method:'DELETE',
    headers:{ 'content-type':'application/json', authorization:'Bearer '+clave },
    body: JSON.stringify({ id }) });
  if(r.ok) cargar();
}

function porDia(){ const m=new Map(); for(const e of eventos){ (m.get(e.fecha)||m.set(e.fecha,[]).get(e.fecha)).push(e); } return m; }

function render(){
  // dows
  $('#dows').innerHTML = DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  // mes
  const y=cursor.getFullYear(), m=cursor.getMonth();
  $('#mesTit').textContent = MESES[m]+' '+y;
  const prim = new Date(y,m,1); let inicio = (prim.getDay()+6)%7; // lunes=0
  const dias = new Date(y,m+1,0).getDate();
  const mapa = porDia();
  const hoyISO = iso(new Date());
  let celdas = '';
  for(let i=0;i<inicio;i++) celdas += `<div class="celda"></div>`;
  for(let d=1;d<=dias;d++){
    const f = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = mapa.get(f)||[];
    const pts = evs.slice(0,4).map(e=>`<span class="pt" style="background:${color(e.tipo)}"></span>`).join('');
    const cls = ['celda','mes']; if(f===hoyISO) cls.push('hoy'); if(f===sel) cls.push('sel');
    celdas += `<div class="${cls.join(' ')}" data-f="${f}"><span>${d}</span><span class="pts">${pts}</span></div>`;
  }
  $('#dias').innerHTML = celdas;
  $('#dias').querySelectorAll('.celda.mes').forEach(c=>c.onclick=()=>{ sel=c.dataset.f; render(); });
  lista();
}

function fmtCuando(e){
  const [Y,M,D]=e.fecha.split('-'); let s=`${D}/${M}`;
  if(e.hora) s+=' · '+e.hora;
  return s;
}
function lista(){
  const hoyISO = iso(new Date());
  const selMap = eventos.filter(e=>e.fecha===sel);
  let arr, titulo;
  if(selMap.length){ arr = selMap.slice(); titulo = 'Día '+sel.split('-').reverse().slice(0,2).join('/'); }
  else { arr = eventos.filter(e=>e.fecha>=hoyISO).slice(0,30); titulo='Próximo'; }
  arr.sort((a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||'')));
  $('#listaTit').textContent = titulo;
  $('#cont').textContent = eventos.length ? eventos.length+' en total' : '';
  if(!arr.length){ $('#lista').innerHTML = `<div class="vacio">Nada por acá todavía.</div>`; return; }
  $('#lista').innerHTML = arr.map(e=>{
    const c = color(e.tipo);
    const bits = [];
    if(e.lugar) bits.push(`<b>Lugar:</b> ${esc(e.lugar)}`);
    if(e.notas) bits.push(esc(e.notas));
    if(e.origen) bits.push(`<span class="mini">de: ${esc(e.origen)}</span>`);
    return `<div class="ev" style="border-left-color:${c}">
      <button class="borrar" title="Borrar" onclick="borrar('${e.id}')">✕</button>
      <div class="cab"><span class="tit">${esc(e.titulo)}</span><span class="cuando">${fmtCuando(e)}</span></div>
      <div class="meta"><span class="chip" style="border-color:${c};color:${c}">${TIPO_TXT[e.tipo]||'otro'}</span>${bits.join(' · ')}</div>
    </div>`;
  }).join('');
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('#prev').onclick=()=>{ cursor.setMonth(cursor.getMonth()-1); render(); };
$('#next').onclick=()=>{ cursor.setMonth(cursor.getMonth()+1); render(); };
$('#hoy').onclick=()=>{ cursor=new Date(); cursor.setDate(1); sel=iso(new Date()); render(); };

$('#fGuardar').onclick = async () => {
  const ev = {
    titulo: $('#fTit').value.trim(), fecha: $('#fFecha').value,
    hora: $('#fHora').value || null, tipo: $('#fTipo').value,
    lugar: $('#fLugar').value.trim(), notas: $('#fNotas').value.trim(),
    origen: $('#fOrigen').value.trim() || 'a mano'
  };
  if(!ev.titulo || !ev.fecha){ estado('Faltan título y fecha.','err'); return; }
  estado('Guardando…');
  const ok = await guardar(ev);
  if(ok){ ['fTit','fHora','fLugar','fNotas'].forEach(i=>$('#'+i).value=''); estado('Guardado ✓','ok'); cargar(); }
  else estado('No se pudo guardar.','err');
};

// Service worker del Panel (avisos / offline), si existe.
if('serviceWorker' in navigator){ navigator.serviceWorker.register('../sw.js').catch(()=>{}); }

cargar();
</script>
</body>
</html>
