<!doctype html>
<meta charset="utf-8">
<title>Panel</title>
<style>
  :root{ --tinta:#f2f0eb; --apagado:#8b8b95; --acento:#CCFF00; --linea:#26262f; color-scheme:dark }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    height:46px; display:flex; align-items:center; gap:4px; padding:0 8px;
    background:#0b0b0f; border-bottom:1px solid var(--linea);
    font:600 12.5px system-ui,-apple-system,'Segoe UI',sans-serif; color:var(--tinta);
    user-select:none; -webkit-app-region:drag;
  }
  button{
    -webkit-app-region:no-drag;
    background:none; border:0; color:var(--apagado);
    font:inherit; padding:8px 11px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; gap:5px; white-space:nowrap;
  }
  button:hover{ background:#17171f; color:var(--tinta) }
  button.on{ background:var(--acento); color:#000 }
  .sep{ flex:1 }
  .chico{ font-size:15px; padding:7px 10px; color:var(--apagado) }
</style>
<button class="chico" id="atras" title="Volver">‹</button>
<button class="chico" id="recargar" title="Recargar">⟳</button>
<div id="secciones" style="display:flex;gap:4px"></div>
<div class="sep"></div>
<script>
  const SECCIONES = [
    ["deportes","⚽ Deportes"], ["plata","💸 Plata"],
    ["campamento","🎹 Campamento"], ["instagram","📸 Instagram"],
  ];
  const caja = document.getElementById('secciones');
  const botones = {};
  SECCIONES.forEach(([id, texto]) => {
    const b = document.createElement('button');
    b.textContent = texto;
    b.onclick = () => window.panel.ir(id);
    caja.appendChild(b);
    botones[id] = b;
  });
  document.getElementById('atras').onclick = () => window.panel.atras();
  document.getElementById('recargar').onclick = () => window.panel.recargar();
  window.panel.alCambiarSeccion(id => {
    Object.entries(botones).forEach(([k, b]) => b.className = (k === id ? 'on' : ''));
  });
</script>
