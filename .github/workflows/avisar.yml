name: Enviar avisos

# Corre sobre el repo panel (antes vivia en mis-deportes).

on:
  # PRENDIDO DE NUEVO el 20/9/2026, a pedido suyo.
  #
  # Manda los avisos por evento, que salen de CONFIG.avisos. Entre el 11 y el
  # 20 de septiembre estuvo apagado porque esa lista quedó vacía y correr esto
  # cada 15 minutos sin nada que mandar sólo gastaba minutos.
  #
  # Ahora la lista tiene UNA entrada —una hora antes— así que son uno o dos
  # avisos por día. Si algún día vuelven a molestar, lo primero es vaciar
  # CONFIG.avisos en config.mjs; apagar sólo este reloj deja el aviso a medias.
  #
  # El repo es público, así que estos minutos de GitHub Actions no se cobran.
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos
  workflow_dispatch:
    inputs:
      prueba:
        description: "Mandar una notificación de prueba en vez de revisar el calendario"
        type: boolean
        default: false

permissions:
  contents: write

# Si un envío todavía está corriendo, el siguiente espera.
# Así nunca hay dos procesos escribiendo el estado a la vez.
concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --omit=dev

      - name: Revisar el calendario y notificar
        env:
          VAPID_PUBLIC:      ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE:     ${{ secrets.VAPID_PRIVATE }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node scripts/send-push.mjs ${{ inputs.prueba && '--test' || '' }}

      - name: Recordar lo ya enviado
        if: ${{ !inputs.prueba }}
        run: |
          git config user.name  "Avisos automáticos"
          git config user.email "actions@github.com"
          git add estado/enviados.json
          git diff --staged --quiet && exit 0
          git commit -m "Avisos enviados"
          # Otro envío pudo haber escrito mientras tanto: reintentamos sobre lo último.
          git pull --rebase --autostash || true
          git push
